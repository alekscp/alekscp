<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aleks CP</title>
  <meta name="description" content="Aleks CP. Building software with friends at Folk Software." />
  <meta name="theme-color" content="#f6f5f0" />
  <link rel="canonical" href="https://alekscp.com/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate" type="text/plain" href="/llms.txt" title="About Aleks CP" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet" />
  <meta property="og:title" content="Aleks CP" />
  <meta property="og:description" content="Building software with friends at Folk Software." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://alekscp.com/" />
  <meta name="twitter:card" content="summary" />
  <style>
    :root { --bg: #f6f5f0; --fg: #252821; --muted: #66695f; --line: #d7d9cf; --accent: #526346; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
    main { min-height: 100vh; min-height: 100svh; display: grid; align-content: center; width: min(100% - 3rem, 42rem); margin: auto; padding: 5rem 0; }
    .mark { width: 0.65rem; height: 0.65rem; background: var(--accent); border-radius: 50%; margin-bottom: 2.5rem; }
    h1 { font-size: clamp(3.5rem, 12vw, 6rem); font-weight: 500; letter-spacing: -0.075em; line-height: 1.05; margin: 0; }
    p { color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.125rem); line-height: 1.65; margin: 1.5rem 0 3.5rem; }
    nav { display: flex; flex-wrap: wrap; gap: 1rem 2.5rem; border-top: 1px solid var(--line); padding-top: 1.25rem; }
    a { display: inline-flex; gap: 1rem; align-items: center; min-height: 2.75rem; color: var(--fg); font: 0.875rem/1.65 "Space Mono", monospace; text-decoration: none; transition: color 0.2s ease; }
    a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 0.3em; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; border-radius: 2px; }
    .arrow { color: var(--accent); }
    @media (max-width: 760px) { main { width: min(100% - 3rem, 32rem); } }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Aleks CP</h1>
    <p>Building software with friends.</p>
    <nav aria-label="Find me elsewhere">
      <a href="https://folk.software/">Folk Software <span class="arrow" aria-hidden="true">↗</span></a>
      <a href="https://www.linkedin.com/in/alekscp/">LinkedIn <span class="arrow" aria-hidden="true">↗</span></a>
    </nav>
  </main>
</body>
</html>
